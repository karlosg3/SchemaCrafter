[package]
name = "schemacrafter"
version = "0.1.0"
description = "Visual database schema designer and ORM code generator"
authors = ["karlosg3"]
license = "MIT"
repository = "https://github.com/karlosg3/SchemaCrafter"
edition = "2024"
rust-version = "1.90"

[lib]
name = "schemacrafter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.13", features = ["json", "stream"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "process"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
